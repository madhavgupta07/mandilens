services:
  - type: web
    name: mandilens
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: AI_PROVIDER
        value: deterministic
      - key: OPEN_MODEL_BASE_URL
        sync: false
      - key: OPEN_MODEL_API_KEY
        sync: false
      - key: OPEN_MODEL_MODEL
        value: gemma-3-12b-it
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434/v1
      - key: OLLAMA_MODEL
        value: gemma3:12b
      - key: AGRICULTURAL_DATA_API_KEY
        sync: false
      - key: AGMARKNET_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: INGESTION_CRON_SECRET
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
